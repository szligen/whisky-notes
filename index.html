<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>威士忌品酒记录</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
    background: #f5f4f0;
    color: #2c2c2a;
    font-size: 14px;
    line-height: 1.6;
  }

  /* Header */
  .header {
    background: #fff;
    border-bottom: 0.5px solid rgba(0,0,0,0.12);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header h1 {
    font-size: 17px;
    font-weight: 500;
    color: #2c2c2a;
    white-space: nowrap;
  }
  .header-stats {
    font-size: 13px;
    color: #888780;
    white-space: nowrap;
  }

  /* Search & filter bar */
  .toolbar {
    background: #fff;
    border-bottom: 0.5px solid rgba(0,0,0,0.1);
    padding: 12px 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
    max-width: 360px;
  }
  .search-wrap input {
    width: 100%;
    padding: 7px 12px 7px 32px;
    border: 0.5px solid rgba(0,0,0,0.2);
    border-radius: 8px;
    font-size: 13px;
    background: #f5f4f0;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-wrap input:focus { border-color: rgba(0,0,0,0.4); background: #fff; }
  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: #888;
    font-size: 13px;
    pointer-events: none;
  }
  select {
    padding: 7px 10px;
    border: 0.5px solid rgba(0,0,0,0.2);
    border-radius: 8px;
    font-size: 13px;
    background: #f5f4f0;
    outline: none;
    cursor: pointer;
  }
  select:focus { border-color: rgba(0,0,0,0.4); }
  .btn-clear {
    padding: 7px 14px;
    border: 0.5px solid rgba(0,0,0,0.2);
    border-radius: 8px;
    font-size: 13px;
    background: transparent;
    cursor: pointer;
    color: #5f5e5a;
  }
  .btn-clear:hover { background: #f0ede8; }

  /* View toggle */
  .view-toggle { display: flex; gap: 4px; margin-left: auto; }
  .view-toggle button {
    padding: 6px 12px;
    border: 0.5px solid rgba(0,0,0,0.2);
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    background: transparent;
    color: #5f5e5a;
  }
  .view-toggle button.active {
    background: #2c2c2a;
    color: #fff;
    border-color: #2c2c2a;
  }

  /* Main layout */
  .main { padding: 20px 24px; }
  .result-count {
    font-size: 12px;
    color: #888780;
    margin-bottom: 14px;
  }

  /* Card grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 14px;
  }
  .card {
    background: #fff;
    border: 0.5px solid rgba(0,0,0,0.1);
    border-radius: 12px;
    padding: 16px;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.1s;
  }
  .card:hover {
    border-color: rgba(0,0,0,0.25);
    transform: translateY(-1px);
  }
  .card-name {
    font-size: 14px;
    font-weight: 500;
    color: #2c2c2a;
    margin-bottom: 4px;
    line-height: 1.4;
  }
  .card-sub {
    font-size: 12px;
    color: #888780;
    margin-bottom: 10px;
  }
  .card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }
  .badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 20px;
    background: #f1efe8;
    color: #5f5e5a;
  }
  .badge-abv { background: #faeeda; color: #633806; }
  .badge-age { background: #e6f1fb; color: #0c447c; }
  .scores {
    display: flex;
    gap: 12px;
    margin-top: 8px;
    padding-top: 10px;
    border-top: 0.5px solid rgba(0,0,0,0.07);
  }
  .score-item { text-align: center; }
  .score-label { font-size: 10px; color: #888780; }
  .score-val {
    font-size: 16px;
    font-weight: 500;
    color: #2c2c2a;
  }
  .card-nose {
    font-size: 12px;
    color: #5f5e5a;
    margin-top: 8px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-date { font-size: 11px; color: #b4b2a9; margin-top: 8px; }

  /* List view */
  .list { display: none; }
  .list.active { display: block; }
  .grid.active { display: grid; }
  .list-item {
    background: #fff;
    border: 0.5px solid rgba(0,0,0,0.1);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .list-item:hover { border-color: rgba(0,0,0,0.25); }
  .list-num { font-size: 11px; color: #b4b2a9; width: 30px; flex-shrink: 0; }
  .list-main { flex: 1; min-width: 0; }
  .list-name { font-size: 14px; font-weight: 500; color: #2c2c2a; }
  .list-meta { font-size: 12px; color: #888780; }
  .list-scores { display: flex; gap: 12px; flex-shrink: 0; }
  .list-score { text-align: center; }
  .list-score .lbl { font-size: 10px; color: #b4b2a9; }
  .list-score .val { font-size: 14px; font-weight: 500; color: #2c2c2a; }

  /* Detail modal */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .overlay.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: 16px;
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 24px;
    position: relative;
  }
  .modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: #f1efe8;
    border: none;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    cursor: pointer;
    font-size: 14px;
    color: #5f5e5a;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-name {
    font-size: 17px;
    font-weight: 500;
    margin-bottom: 4px;
    padding-right: 32px;
    line-height: 1.4;
  }
  .modal-bottler { font-size: 13px; color: #888780; margin-bottom: 16px; }
  .modal-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .modal-field { }
  .modal-field .lbl { font-size: 11px; color: #888780; }
  .modal-field .val { font-size: 13px; color: #2c2c2a; font-weight: 500; }
  .section-title {
    font-size: 12px;
    font-weight: 500;
    color: #888780;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 14px 0 8px;
  }
  .tasting-row { margin-bottom: 8px; }
  .tasting-row .lbl { font-size: 12px; color: #888780; margin-bottom: 2px; }
  .tasting-row .val { font-size: 13px; color: #2c2c2a; }
  .score-row {
    display: flex;
    gap: 0;
    border: 0.5px solid rgba(0,0,0,0.1);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .score-cell {
    flex: 1;
    padding: 12px;
    text-align: center;
    border-right: 0.5px solid rgba(0,0,0,0.08);
  }
  .score-cell:last-child { border-right: none; }
  .score-cell .lbl { font-size: 11px; color: #888780; }
  .score-cell .val { font-size: 22px; font-weight: 500; color: #2c2c2a; }
  .modal-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .modal-tag {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 20px;
    background: #f1efe8;
    color: #5f5e5a;
  }
  .wb-link {
    display: inline-block;
    margin-top: 14px;
    font-size: 12px;
    color: #185fa5;
    text-decoration: none;
  }
  .wb-link:hover { text-decoration: underline; }
  .empty {
    text-align: center;
    padding: 60px 0;
    color: #888780;
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>威士忌品酒记录</h1>
  <span class="header-stats" id="statsText">载入中...</span>
</div>

<div class="toolbar">
  <div class="search-wrap">
    <span class="search-icon">&#128269;</span>
    <input type="text" id="searchInput" placeholder="搜索酒名、酒厂、装瓶商..." oninput="applyFilters()">
  </div>
  <select id="filterRegion" onchange="applyFilters()">
    <option value="">全部产区</option>
  </select>
  <select id="filterDistillery" onchange="applyFilters()">
    <option value="">全部酒厂</option>
  </select>
  <select id="sortBy" onchange="applyFilters()">
    <option value="date_desc">最新品酒</option>
    <option value="date_asc">最早品酒</option>
    <option value="score_desc">评分最高</option>
    <option value="score_asc">评分最低</option>
    <option value="name_asc">酒名 A-Z</option>
    <option value="age_desc">年份最长</option>
  </select>
  <button class="btn-clear" onclick="clearFilters()">重置</button>
  <div class="view-toggle">
    <button id="btnGrid" class="active" onclick="setView('grid')">卡片</button>
    <button id="btnList" onclick="setView('list')">列表</button>
  </div>
</div>

<div class="main">
  <div class="result-count" id="resultCount"></div>
  <div class="grid active" id="gridView"></div>
  <div class="list" id="listView"></div>
  <div class="empty" id="emptyMsg" style="display:none">没有找到匹配的记录</div>
</div>

<!-- Detail modal -->
<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <button class="modal-close" onclick="closeModal()">&#10005;</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
let allRecords = [];
let filteredRecords = [];
let currentView = 'grid';

async function loadData() {
  try {
    const res = await fetch('whisky_notes.json');
    if (!res.ok) throw new Error('fetch failed');
    const data = await res.json();
    allRecords = data.records || [];
    buildFilters();
    applyFilters();
    document.getElementById('statsText').textContent = `共 ${allRecords.length} 条记录`;
  } catch(e) {
    document.getElementById('gridView').innerHTML = '<div class="empty">无法加载 whisky_notes.json，请确认文件路径正确</div>';
    document.getElementById('statsText').textContent = '加载失败';
  }
}

function buildFilters() {
  const regions = [...new Set(allRecords.map(r => r.region).filter(Boolean))].sort();
  const distilleries = [...new Set(allRecords.map(r => r.distillery).filter(Boolean))].sort();
  const rSel = document.getElementById('filterRegion');
  const dSel = document.getElementById('filterDistillery');
  regions.forEach(r => {
    const o = document.createElement('option'); o.value = r; o.textContent = r; rSel.appendChild(o);
  });
  distilleries.forEach(d => {
    const o = document.createElement('option'); o.value = d; o.textContent = d; dSel.appendChild(o);
  });
}

function totalScore(r) {
  if (r.score_total) return r.score_total;
  const vals = [r.score_nose, r.score_body, r.score_finish].filter(v => v != null);
  if (!vals.length) return null;
  return Math.round((vals.reduce((a,b) => a+b, 0) / vals.length) * 10) / 10;
}

function applyFilters() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const region = document.getElementById('filterRegion').value;
  const distillery = document.getElementById('filterDistillery').value;
  const sort = document.getElementById('sortBy').value;

  let results = allRecords.filter(r => {
    const text = [r.name, r.distillery, r.bottler, r.nose, r.finish, r.palate, (r.tags||[]).join(' ')].join(' ').toLowerCase();
    if (q && !text.includes(q)) return false;
    if (region && r.region !== region) return false;
    if (distillery && r.distillery !== distillery) return false;
    return true;
  });

  results.sort((a, b) => {
    if (sort === 'date_desc') return (b.date||'').localeCompare(a.date||'');
    if (sort === 'date_asc') return (a.date||'').localeCompare(b.date||'');
    if (sort === 'score_desc') return (totalScore(b)||0) - (totalScore(a)||0);
    if (sort === 'score_asc') return (totalScore(a)||0) - (totalScore(b)||0);
    if (sort === 'name_asc') return (a.name||'').localeCompare(b.name||'', 'zh');
    if (sort === 'age_desc') return (b.age||0) - (a.age||0);
    return 0;
  });

  filteredRecords = results;
  document.getElementById('resultCount').textContent = `找到 ${results.length} 条记录`;
  document.getElementById('emptyMsg').style.display = results.length ? 'none' : 'block';
  renderGrid(results);
  renderList(results);
}

function clearFilters() {
  document.getElementById('searchInput').value = '';
  document.getElementById('filterRegion').value = '';
  document.getElementById('filterDistillery').value = '';
  document.getElementById('sortBy').value = 'date_desc';
  applyFilters();
}

function setView(v) {
  currentView = v;
  document.getElementById('gridView').className = 'grid' + (v==='grid' ? ' active' : '');
  document.getElementById('listView').className = 'list' + (v==='list' ? ' active' : '');
  document.getElementById('btnGrid').className = v==='grid' ? 'active' : '';
  document.getElementById('btnList').className = v==='list' ? 'active' : '';
}

function scoreBar(val) {
  if (val == null) return '–';
  return val.toFixed(1);
}

function renderGrid(records) {
  const el = document.getElementById('gridView');
  if (!records.length) { el.innerHTML = ''; return; }
  el.innerHTML = records.map((r, i) => `
    <div class="card" onclick="openDetail(${allRecords.indexOf(r)})">
      <div class="card-name">${r.name || '未命名'}</div>
      <div class="card-sub">${[r.distillery, r.bottler].filter(Boolean).join(' · ')}</div>
      <div class="card-meta">
        ${r.abv ? `<span class="badge badge-abv">${r.abv}%</span>` : ''}
        ${r.age ? `<span class="badge badge-age">${r.age}年</span>` : ''}
        ${r.region ? `<span class="badge">${r.region}</span>` : ''}
        ${r.cask_type ? `<span class="badge">${r.cask_type}</span>` : ''}
      </div>
      ${r.nose ? `<div class="card-nose">${r.nose}</div>` : ''}
      <div class="scores">
        <div class="score-item"><div class="score-label">入口</div><div class="score-val">${scoreBar(r.score_nose)}</div></div>
        <div class="score-item"><div class="score-label">气韵</div><div class="score-val">${scoreBar(r.score_body)}</div></div>
        <div class="score-item"><div class="score-label">喉感</div><div class="score-val">${scoreBar(r.score_finish)}</div></div>
        ${totalScore(r) ? `<div class="score-item" style="margin-left:auto"><div class="score-label">综合</div><div class="score-val" style="color:#185fa5">${totalScore(r)}</div></div>` : ''}
      </div>
      <div class="card-date">${r.date || ''}</div>
    </div>
  `).join('');
}

function renderList(records) {
  const el = document.getElementById('listView');
  if (!records.length) { el.innerHTML = ''; return; }
  el.innerHTML = records.map((r, i) => `
    <div class="list-item" onclick="openDetail(${allRecords.indexOf(r)})">
      <div class="list-num">#${i+1}</div>
      <div class="list-main">
        <div class="list-name">${r.name || '未命名'}</div>
        <div class="list-meta">${[r.distillery, r.bottler, r.date].filter(Boolean).join(' · ')}</div>
      </div>
      <div class="list-scores">
        <div class="list-score"><div class="lbl">入口</div><div class="val">${scoreBar(r.score_nose)}</div></div>
        <div class="list-score"><div class="lbl">气韵</div><div class="val">${scoreBar(r.score_body)}</div></div>
        <div class="list-score"><div class="lbl">喉感</div><div class="val">${scoreBar(r.score_finish)}</div></div>
      </div>
    </div>
  `).join('');
}

function openDetail(idx) {
  const r = allRecords[idx];
  if (!r) return;
  const ts = totalScore(r);
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-name">${r.name || '未命名'}</div>
    <div class="modal-bottler">${r.bottler || ''}</div>
    <div class="score-row">
      <div class="score-cell"><div class="lbl">入口</div><div class="val">${scoreBar(r.score_nose)}</div></div>
      <div class="score-cell"><div class="lbl">气韵</div><div class="val">${scoreBar(r.score_body)}</div></div>
      <div class="score-cell"><div class="lbl">喉感</div><div class="val">${scoreBar(r.score_finish)}</div></div>
      ${ts ? `<div class="score-cell" style="background:#f0f7ff"><div class="lbl">综合</div><div class="val" style="color:#185fa5">${ts}</div></div>` : ''}
    </div>
    <div class="modal-grid">
      ${r.distillery ? `<div class="modal-field"><div class="lbl">酒厂</div><div class="val">${r.distillery}</div></div>` : ''}
      ${r.abv ? `<div class="modal-field"><div class="lbl">酒精度</div><div class="val">${r.abv}%</div></div>` : ''}
      ${r.age ? `<div class="modal-field"><div class="lbl">年份</div><div class="val">${r.age}年</div></div>` : ''}
      ${r.distilled ? `<div class="modal-field"><div class="lbl">蒸馏年份</div><div class="val">${r.distilled}</div></div>` : ''}
      ${r.bottled ? `<div class="modal-field"><div class="lbl">装瓶年份</div><div class="val">${r.bottled}</div></div>` : ''}
      ${r.region ? `<div class="modal-field"><div class="lbl">产区</div><div class="val">${r.region}</div></div>` : ''}
      ${r.country ? `<div class="modal-field"><div class="lbl">国家</div><div class="val">${r.country}</div></div>` : ''}
      ${r.cask_type ? `<div class="modal-field"><div class="lbl">桶型</div><div class="val">${r.cask_type}</div></div>` : ''}
      ${r.date ? `<div class="modal-field"><div class="lbl">品酒日期</div><div class="val">${r.date}</div></div>` : ''}
      ${r.wb_id ? `<div class="modal-field"><div class="lbl">WB号</div><div class="val">${r.wb_id}</div></div>` : ''}
    </div>
    ${r.nose ? `<div class="section-title">闻香</div><div class="tasting-row"><div class="val">${r.nose}</div></div>` : ''}
    ${r.palate ? `<div class="section-title">入口</div><div class="tasting-row"><div class="val">${r.palate}</div></div>` : ''}
    ${r.finish ? `<div class="section-title">余韵</div><div class="tasting-row"><div class="val">${r.finish}</div></div>` : ''}
    ${r.notes ? `<div class="section-title">备注</div><div class="tasting-row"><div class="val">${r.notes}</div></div>` : ''}
    ${r.tags && r.tags.length ? `
      <div class="section-title">标签</div>
      <div class="modal-tags">${r.tags.map(t => `<span class="modal-tag">${t}</span>`).join('')}</div>
    ` : ''}
    ${r.wb_id ? `<a class="wb-link" href="https://www.whiskybase.com/whiskies/whisky/${r.wb_id}/details" target="_blank">在 Whiskybase 上查看 ↗</a>` : ''}
  `;
  document.getElementById('overlay').classList.add('open');
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('overlay') || e.currentTarget.className === 'modal-close') {
    document.getElementById('overlay').classList.remove('open');
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('overlay').classList.remove('open');
});

loadData();
</script>
</body>
</html>
